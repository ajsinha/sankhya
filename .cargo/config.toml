[alias]
xtask = "run --quiet --package xtask --"

# Half the cores, deliberately, and it is not a throughput decision.
#
# Cargo defaults to one job per core --- twenty-four here --- and a job building a
# DataFusion-scale crate holds gigabytes at its peak. A full `check-all` was observed running
# eighty-five concurrent `rustc` processes on a machine with 62 GB of RAM, 51 GB of which was
# already page cache for a target/ directory well over a hundred gigabytes. The result was
# sustained swapping, and the process the kernel starved was not always the compiler: several
# long-running sessions died mid-build on 2026-08-30.
#
# Twelve jobs bounds the peak to something this machine actually has. It is also not slower in
# wall-clock terms, because a build that swaps is not using twenty-four cores --- it is waiting
# on disk with twenty-four processes queued behind it.
#
# Raise this only on a machine with more memory per core, and lower it if a build ever swaps
# again: `free -g` during a build is the measurement, not the core count.
[build]
jobs = 12

# Link with the LLVM linker the toolchain already ships.
#
# # Why this is worth a config entry
#
# This workspace is sixty crates and builds well over forty test binaries, each linked
# separately and each pulling in the whole of DataFusion and Arrow. Linking is a large part of
# every incremental build here, and GNU `ld` does it on one thread.
#
# `rust-lld` is not a new dependency: it is inside the toolchain directory already, reached
# through rustc's own `-Zgcc-ld`-style shim directory. That matters more than the speed does ---
# a linker installed separately is a build that behaves differently on the machine that has it,
# and `rust-toolchain.toml` pins this one along with the compiler.
#
# Remove this block if a link ever fails in a way GNU `ld` would not: it is an optimisation,
# and nothing about the correctness of this workspace depends on which linker produced it.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=lld"]
