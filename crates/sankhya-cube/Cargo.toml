[package]
name         = "sankhya-cube"
description  = "The declared cube definition: validated once, versioned by its own content."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 3

[lints]
workspace = true

[dependencies]
sankhya-atomicfs = { path = "../sankhya-atomicfs" }
sankhya-cube-algo = { path = "../sankhya-cube-algo" }
sankhya-error     = { path = "../sankhya-error" }
sankhya-graph-algo = { path = "../sankhya-graph-algo" }
sankhya-math      = { path = "../sankhya-math" }
arrow-array       = { workspace = true }
arrow-schema      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
parking_lot       = { workspace = true }

[dev-dependencies]
# The quiet-machine window. A contention measurement taken while the rest of the suite is
# running describes the scheduler's mood, and a gate that fails at random is a gate that gets
# re-run until it passes.
sankhya-testkit = { path = "../sankhya-testkit" }
tempfile = { workspace = true }
proptest = { workspace = true }
