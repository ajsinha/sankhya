[package]
name         = "sankhya-api-pg"
description  = "PostgreSQL wire protocol front door."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 4

[lints]
workspace = true

[dependencies]
sankhya-tls   = { path = "../sankhya-tls" }
sankhya-types   = { path = "../sankhya-types" }
sankhya-error   = { path = "../sankhya-error" }
sankhya-authz   = { path = "../sankhya-authz" }
sankhya-session = { path = "../sankhya-session" }
bytes           = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
rustls          = { workspace = true }
sankhya-testkit = { path = "../sankhya-testkit" }
tokio-rustls    = { workspace = true }
tempfile        = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

