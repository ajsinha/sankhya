[package]
name         = "sankhya-diagnostic"
description  = "Operator diagnostics that report time until impact rather than a current value."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 3

[lints]
workspace = true

[dependencies]
sankhya-types       = { path = "../sankhya-types" }
sankhya-version     = { path = "../sankhya-version" }
sankhya-error       = { path = "../sankhya-error" }
sankhya-math        = { path = "../sankhya-math" }
sankhya-table-delta = { path = "../sankhya-table-delta" }

[dev-dependencies]
sankhya-feed = { path = "../sankhya-feed" }
# The soak drives the product's own write and maintenance paths. Dev-dependencies, because
# the soak is a test: nothing here is compiled into anything that ships.
sankhya-clone       = { path = "../sankhya-clone" }
sankhya-ingest      = { path = "../sankhya-ingest" }
sankhya-publish     = { path = "../sankhya-publish" }
sankhya-maintenance = { path = "../sankhya-maintenance" }
sankhya-cube        = { path = "../sankhya-cube" }
sankhya-cube-sql    = { path = "../sankhya-cube-sql" }
sankhya-readpath    = { path = "../sankhya-readpath" }
datafusion          = { workspace = true }
tokio               = { workspace = true }
sankhya-table       = { path = "../sankhya-table" }
sankhya-table-delta = { path = "../sankhya-table-delta" }
sankhya-types       = { path = "../sankhya-types" }
arrow-array         = { workspace = true }
# Reading values back, not merely counting them: the soak has to prove a clone can still open
# what its plan names, and a row count comes from the log rather than from the file.
parquet             = { workspace = true }
arrow-schema        = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
