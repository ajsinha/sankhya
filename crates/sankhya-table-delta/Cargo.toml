[package]
name         = "sankhya-table-delta"
description  = "TableFormat over delta_kernel. Metadata only; no bulk data crosses a version boundary."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 2

[lints]
workspace = true

[dependencies]
sankhya-atomicfs = { path = "../sankhya-atomicfs" }
sankhya-types = { path = "../sankhya-types" }
sankhya-error = { path = "../sankhya-error" }
sankhya-stats = { path = "../sankhya-stats" }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true }
arrow-schema  = { workspace = true }
arrow-array   = { workspace = true }
arrow-buffer  = { workspace = true }
parquet       = { workspace = true }

# Test-only, deliberately.
#
# The kernel and its engine are used as an independent *oracle*: they read the log this
# crate writes and must agree with this crate's own reader. Keeping them out of the
# production dependency path is what DEC-06's metadata-only coupling actually asks for --
# the storage library supplies a definition of correctness, not an I/O layer. It also
# keeps 84 packages and a duplicated HTTP client out of the shipped binary.
[dev-dependencies]
sankhya-testkit             = { path = "../sankhya-testkit" }
serde_json = { workspace = true }
delta_kernel                = { workspace = true }
delta_kernel_default_engine = { workspace = true }
tempfile                    = { workspace = true }
tokio                       = { workspace = true }
url                         = "2"
