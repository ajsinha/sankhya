[package]
name         = "sankhya-soak"
description  = "Judging a long run: nothing grows without bound, and a harness proven to notice when something does."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 3

[lints]
workspace = true

[[bin]]
name = "sankhya-soak"
path = "src/bin/soak.rs"

[dependencies]
sankhya-diagnostic  = { path = "../sankhya-diagnostic" }
sankhya-table       = { path = "../sankhya-table" }
sankhya-table-delta = { path = "../sankhya-table-delta" }
sankhya-types       = { path = "../sankhya-types" }
arrow-array         = { workspace = true }
arrow-schema        = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
