[package]
name         = "sankhya-alloc"
description  = "The counting allocator. One of two crates in which unsafe code is permitted."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 0

# Deliberately NOT `workspace = true`.
#
# The workspace forbids unsafe code, and `forbid` cannot be relaxed locally — which is
# exactly why it is used. This crate exists so that a place where unsafe is
# unavoidable is a crate you can read in a sitting, rather than a lint exception scattered
# through a larger one. `sankhya-sandbox` is the only other, for the same kind of reason and
# under `ADR-0023` Decision 8; `cargo xtask check-unsafety` fails the build if a third appears.
#
# Everything else the workspace denies is repeated here, so the exception is to `unsafe`
# and to nothing else.
[lints.rust]
unsafe_code                   = "deny"
unreachable_pub               = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
