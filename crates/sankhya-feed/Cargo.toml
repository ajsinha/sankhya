[package]
name         = "sankhya-feed"
description  = "A declared feed: what arrives, how it is shaped, and where it lands."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 3

[lints]
workspace = true

[dependencies]
sankhya-schema = { path = "../sankhya-schema" }
sankhya-publish = { path = "../sankhya-publish" }
sankhya-types   = { path = "../sankhya-types" }
arrow-array    = { workspace = true }
arrow-schema   = { workspace = true }
serde          = { workspace = true }
time           = { workspace = true }
uuid           = { workspace = true }
serde_json     = { workspace = true }
serde_yaml_ng  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: counting the rows a feed actually wrote. A duplicate published row is invisible
# in every counter the run reports --- `published` counts what it sent, not what is there ---
# so the assertion that `ING-01` needs has to read the table.
sankhya-table-delta = { path = "../sankhya-table-delta" }
