[package]
name         = "sankhya-udf"
description  = "User-supplied aggregations: the four-method contract, run behind the sandbox."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license-file.workspace      = true
repository.workspace   = true

[package.metadata.sankhya]
layer = 1

[lints]
workspace = true

[dependencies]
# The worker's own file is published rather than written. It lands in a directory this process
# just made, so nothing is reading it --- and an excuse costs more than the one line: excuses
# accumulate, and the next one is argued against this one.
sankhya-atomicfs = { path = "../sankhya-atomicfs" }
sankhya-sandbox = { path = "../sankhya-sandbox" }
tempfile = { workspace = true }

[dev-dependencies]
