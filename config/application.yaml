# SANKHYA — default configuration.
#
# Precedence, highest first:
#   1. --key=value on the command line
#   2. an environment variable (see the table in docs/GUIDE.md for the legacy SANKHYA_* names)
#   3. config/application.local.yaml — git-ignored, for what a machine needs and must not commit
#   4. this file
#
# `${NAME}` refers to another setting, an environment variable or an argument.
# `${NAME:default}` makes the reference optional. An unresolved reference with no default
# fails the load rather than reaching a connection string as a literal `${NAME}`.

server:
  # Loopback by default. A listener on every interface should be a decision somebody made.
  listen: 127.0.0.1:5433
  # A metrics endpoint on every interface is a small permanent disclosure of the
  # deployment's shape, so the safe choice is the one an operator gets by not deciding.
  metrics_listen: 127.0.0.1:9464
  # Spelled as an opt-*out*, so the insecure choice has to be made deliberately.
  #
  # This requires a password to be *presented*. Whether it is *verified* depends on whether
  # `credentials` below names anybody: with an empty list there is nothing to check against and
  # any non-empty password from any user is accepted. The startup line says which of the two
  # you have, in words, and capitalises the one that is not authentication.
  require_password: true

  # What each user's password is checked against. `SEC-01` --- until 2026-09-04 there was no
  # credential store at all, and the check was that a password was non-empty.
  #
  # Make a line with `sankhya-server hash-password`, which reads the password from standard
  # input rather than taking it as an argument: an argument is in your shell history and in
  # `ps` output for every user on the machine.
  #
  # Empty means no user has a password written down, and that is the old behaviour on purpose:
  # an operator who has configured nothing has decided nothing. **Naming one user is deciding
  # the list is the list** --- a user absent from it is then refused, which is the same rule as
  # `users` above and for the same reason. Forgetting somebody must not grant them access.
  #
  # The verifier is PBKDF2-HMAC-SHA256 and carries its own iteration count, so raising the
  # default does not invalidate the credentials already written down here.
  #
  # credentials:
  #   ana: pbkdf2-sha256$600000$<salt>$<key>

  # Whether `CREATE AGGREGATION` is accepted. It runs code the caller supplied, inside the
  # sandbox `ADR-0023` describes, and the sandbox is a boundary rather than a guarantee.
  #
  # Off unless you turn it on. `ADR-0023` Decision 4 specifies a grant that is per principal
  # rather than per server; that half is not built, and a server-wide switch that starts
  # closed is the honest version of it until it is. `SHOW AGGREGATIONS` answers either way.
  user_functions: false

  # Whether `/metrics` may name individual tables.
  #
  # Off unless you turn it on, and for the same reason as the switch above: the per-table
  # gauge's label is a table's fully-qualified name, and `/metrics` is unauthenticated by
  # Prometheus's convention --- so the breakdown enumerates the warehouse to anybody who can
  # reach the port.
  #
  # What an alert fires on is `sankhya_table_live_files_max`, which carries no label and is
  # exported either way: what pages is that *some* table has too many files, and which one is a
  # question `sankhya doctor` answers to somebody who has authenticated. Turn this on where the
  # metrics interface is one clients cannot reach and you want the breakdown on a dashboard.
  metrics_detail: false

  # Transport security. Both doors --- the wire protocol and Arrow Flight SQL --- present the
  # certificate configured here. One certificate rather than two: two would be two expiries,
  # two renewals, and two chances for the pair to disagree about who this server is.
  #
  # Unset by default, which means both doors are in the clear and a password crosses the
  # network as it was typed. That is defensible on a loopback and is credential exposure the
  # moment a client is somewhere else. The startup line says which one you have, in words,
  # every time.
  #
  # A certificate with no key, or a key with no certificate, **stops startup**. A server that
  # started in the clear there would be one whose operator believes it is encrypted.
  #
  # tls:
  #   certificate: /etc/sankhya/server.crt
  #   private_key: /etc/sankhya/server.key
  #   # Anchors a client's own certificate must chain to. Setting it makes both doors mutual:
  #   # a client with nothing to show for itself is refused at the handshake, before it can
  #   # send a password.
  #   client_ca: /etc/sankhya/clients.pem
  #   # Whether a wire-protocol client that never asks for TLS is refused. Only that door has
  #   # the question --- its clients negotiate, so a door can be encrypted and permissive at
  #   # once. Defaults to true: an operator who configured a certificate did not do it so a
  #   # client could decline to use it.
  #   require: true

warehouse:
  # Where published tables live: <path>/<schema>/<table>.
  path: ./warehouse
  # The position to read as of. Left unset, which means everything published --- what a
  # server with no ingest running in this process to advance it wants.
  #
  # Unset rather than spelled out: "everything" is `u64::MAX`, and a configuration file is
  # read through a signed integer, so the literal 18446744073709551615 does not parse. It
  # was written here once and refused every subcommand this binary has, `--version`
  # included, until a first-run audit found it.
  # read_as_of: 4102444800

data:
  # Where the diagnostic keeps its observation history — beside the warehouse rather than
  # inside it, because the warehouse is the thing being diagnosed and may be the subject of
  # the finding.
  dir: ${warehouse.path}/../.sankhya

# Per-table physical layout.
#
# `clustering` is a SORT ORDER applied when a partition is compacted and has settled. It
# adds no directories and is reversible: a table clustered on the wrong column is fixed by
# editing this line and waiting for the next compaction.
#
# Prefer it to a second partition column. ARCHITECTURE §9.8: "partitioning is a physical
# commitment that is expensive or impossible to undo; clustering is cheap to change at the
# next compaction. When uncertain, prefer the reversible decision — sort, do not partition."
#
# Undeclared means unclustered. Nothing is inferred: the engine cannot tell a meaningful
# query boundary from a merely low-cardinality column.
#
# table:
#   sales:
#     orders:
#       clustering: order_date,region

# How the warehouse keeps itself in shape.
#
# Compaction merges small files and retirement removes what a merge replaced, once its grace
# period has run. Both happen on a thread the server owns; nothing outside the server drives
# them, and no client needs to know they exist.
#
# Nothing ran either of these before: maintenance shipped as a library that only tests
# called, so a running server accumulated files for as long as it was up.
maintenance:
  # How often a maintenance pass runs. A pass is bounded work, so this is the rate the
  # warehouse catches up at, not how long it spends. Suffixes: s, m, h.
  #
  # 0 disables maintenance entirely, for the one honest case: another process is doing it.
  # Two maintainers on one warehouse are two committers racing for the same version.
  interval: 30s

  # Ticks between compaction passes. 1 --- every tick --- because a pass is already bounded
  # by max_files_per_pass, and a partition below the merge thresholds costs only the decision
  # not to merge it.
  #
  # Raise it to trade promptness for quiet: a deployment whose queries are latency-sensitive
  # can compact every fourth tick and still keep up, so long as writes arrive slower than
  # four ticks of merging. Set it too high and small files accumulate faster than they are
  # merged, which shows up as live-file count climbing rather than sawtoothing.
  compact_every: 1

  # Ticks between sweeps for files the log does not name. 120 --- an hour at the default
  # interval --- because a sweep walks the whole table directory, returns nothing most of the
  # time, and what it collects is not urgent.
  #
  # An orphan appears only when a merge writes its output and then loses the race to commit
  # it. The age policy will not let one be removed until it is a week old in any case, so
  # sweeping more often finds the same files and deletes none of them sooner.
  orphan_sweep_every: 120
