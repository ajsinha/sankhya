# A deployment, with the two settings that are usually wrong.
#
# 1. `terminationGracePeriodSeconds` must exceed the server's drain deadline (30s), or every
#    rollout SIGKILLs a server mid-drain and clients see resets that look like crashes. The
#    two numbers live in different files and nothing normally relates them, so
#    `cargo xtask check-package` compares them and fails the build when they disagree.
#
# 2. The readiness probe accounts for pipeline lag and the liveness probe does not.
#    ARCHITECTURE §17.2: a liveness probe that fails on lag causes the orchestrator to kill a
#    healthy node, converting a degradation into an outage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sankhya
  labels:
    app.kubernetes.io/name: sankhya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sankhya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sankhya
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: sankhya
          image: ghcr.io/ajsinha/sankhya:0.1.0
          args: []
          ports:
            - name: pgwire
              containerPort: 5433
            # `RUN-10`. Flight SQL is a headline feature of this system and the shipped
            # manifest did not declare its port, so it was unreachable in every deployment
            # made from this file --- and unconfigurable besides, because there was no
            # environment variable for it either.
            - name: flight
              containerPort: 5434
            - name: metrics
              containerPort: 9464
          env:
            - name: SANKHYA_WAREHOUSE
              value: /var/lib/sankhya/warehouse
            - name: SANKHYA_DATA_DIR
              value: /var/lib/sankhya/.sankhya
            - name: SANKHYA_LISTEN
              value: 0.0.0.0:5433
            # Bound to every interface inside the pod, not on the host: the pod boundary is
            # what keeps this private here, where a loopback bind would stop the sidecar
            # scraping it.
            - name: SANKHYA_METRICS_LISTEN
              value: 0.0.0.0:9464
            # Every interface inside the pod, for the reason the metrics door is: the pod
            # boundary is the isolation, and a loopback bind would make the port declared
            # above unreachable from the Service that routes to it.
            - name: SANKHYA_FLIGHT_LISTEN
              value: 0.0.0.0:5434
          # Liveness: is the process alive. Nothing about lag, deliberately.
          livenessProbe:
            tcpSocket:
              port: pgwire
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: is it worth sending traffic to. This is where lag belongs.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/sankhya
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sankhya-data
---
# `RUN-11`. The deployment above referenced `sankhya-data` and no manifest defined it, so
# `kubectl apply -f` left a pod pending on a volume that does not exist.
#
# `ReadWriteOnce` and one replica, deliberately. The warehouse takes a lock and refuses a
# second server --- `COR-15`: two servers each plan compactions against a live set the other
# is changing --- so a volume that could be mounted by two pods would be a volume that lets
# the deployment scale itself into the failure the lock exists to prevent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sankhya-data
  labels:
    app.kubernetes.io/name: sankhya
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
# And something to route to. The deployment shipped no Service, so nothing reached 5433 ---
# a manifest that starts a server nobody can connect to.
#
# `ClusterIP` rather than `LoadBalancer`: this is a database, and the decision to expose one
# outside the cluster belongs to whoever is deploying it rather than to a file in the
# repository. The metrics port is deliberately absent from the Service --- it is scraped
# from inside the pod by the annotations above, and putting it here would make the
# deployment's shape readable from anywhere in the cluster.
apiVersion: v1
kind: Service
metadata:
  name: sankhya
  labels:
    app.kubernetes.io/name: sankhya
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sankhya
  ports:
    - name: pgwire
      port: 5433
      targetPort: pgwire
    - name: flight
      port: 5434
      targetPort: flight
