[workspace]
resolver = "2"
members = ["crates/*", "packs/*", "xtask"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.90"
# Proprietary. `license-file` rather than `license`, because `license` takes an SPDX
# identifier and there is no SPDX identifier for a licence owned by one person. A stale
# `license = "Apache-2.0"` here would keep telling every tool that reads a manifest the
# opposite of what LICENSE says.
license-file = "LICENSE"
publish      = false
repository   = "https://github.com/ajsinha/sankhya"
authors      = ["SANKHYA contributors"]

# ---------------------------------------------------------------------------
# PIN SET — see docs/adr/0001-dependency-pin-set.md
# Verified 2026-08-25: resolves and compiles with zero critical duplicates.
# The arrow / parquet / datafusion / object_store family is EXACT-pinned.
# Changing any of these is a project-level event, not a dependency bump.
# ---------------------------------------------------------------------------
[workspace.dependencies]
arrow         = { version = "=59.2.0" }
arrow-array   = { version = "=59.2.0" }
arrow-schema  = { version = "=59.2.0" }
arrow-buffer  = { version = "=59.2.0" }
arrow-select  = { version = "=59.2.0" }
arrow-ipc     = { version = "=59.2.0" }
arrow-flight  = { version = "=59.2.0", features = ["flight-sql-experimental"] }
parquet       = { version = "=59.2.0", default-features = false, features = ["arrow", "async", "zstd", "snap"] }
object_store  = { version = "=0.13.2" }
# Features are chosen deliberately rather than inherited. Excluded on purpose:
# `compression` (the object-store layer owns codec choice) and `recursive_protection`
# (revisited when a SQL surface exists and unbounded recursion becomes reachable).
datafusion    = { version = "=55.0.0", default-features = false, features = [
    "parquet", "sql", "unicode_expressions", "datetime_expressions",
    "string_expressions", "math_expressions", "regex_expressions",
] }
delta_kernel_default_engine = { version = "=0.27.1", default-features = false }
# TPC-H data generation, for benchmarks only. Pure Rust with no C dependency, which is
# why it is viable here at all: the reference generator is a C program that would have to
# be vendored, built and kept working on every platform this is developed on.
tpchgen       = { version = "=3.0.0" }
tpchgen-arrow = { version = "=3.0.0" }
delta_kernel  = { version = "=0.27.1", default-features = false, features = ["arrow-59"] }

tokio         = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "process", "io-util", "net"] }
tokio-util    = { version = "0.7" }
# `tls-connect-info` and nothing more. It adds the `Connected` implementation for a
# TLS stream — which is what lets this server wrap its own acceptor around the columnar
# door — without pulling tonic's own TLS stack. That matters: certificates are loaded in
# exactly one place (`sankhya-tls`), so a refusal reads the same on either door, and no
# second crate gets to decide which crypto provider this process uses.
tonic         = { version = "0.14", features = ["tls-connect-info"] }
prost         = { version = "0.14" }
futures-util  = { version = "0.3" }
futures       = { version = "0.3" }
async-trait   = { version = "0.1" }

thiserror     = { version = "2" }
serde         = { version = "1", features = ["derive"] }
serde_json    = { version = "1" }
# YAML for configuration. `serde_yaml` is archived; this is the maintained fork.
serde_yaml_ng = { version = "=0.10.0" }
toml          = { version = "0.9" }

tracing       = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

rust_decimal  = { version = "1", features = ["serde"] }
uuid          = { version = "1", features = ["v4", "v7", "serde"] }
time          = { version = "0.3", features = ["formatting", "parsing", "macros"] }
bytes         = { version = "1" }
parking_lot   = { version = "0.12" }
dashmap       = { version = "6" }
rand          = { version = "0.9" }

# TLS on both doors — `FR-SEC-03`, ADR-0017. `ring` rather than `aws-lc-rs`, which is
# rustls's default: `ring` is already what resolves here through the object-store HTTP
# client, and two crypto providers in one process is an ambiguity about what a server
# actually negotiated. `default-features = false` is what makes that choice stick.
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls  = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rand_chacha   = { version = "0.9" }

# dev
sha2          = { version = "0.10", default-features = false }
proptest      = { version = "1" }
insta         = { version = "1" }
criterion     = { version = "0.8" }
tempfile      = { version = "3" }
# Certificates for tests, generated rather than committed: a private key in a repository
# is a private key, whatever the file is named. `ring` again, for the reason above.
rcgen         = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[workspace.lints.rust]
unsafe_code                   = "forbid"
unreachable_pub               = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
todo          = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
float_cmp     = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits      = "release"
debug         = "line-tables-only"
lto           = "thin"
codegen-units = 1
