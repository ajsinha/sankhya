[package]
name         = "xtask"
description  = "Repository enforcement tooling: layer checks, line limits, vocabulary lint, duplicate-version gate."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish      = false

[package.metadata.sankhya]
layer = 100

[dependencies]
# Tooling may depend on anything; the catalogue generators read the declarations
# themselves rather than a copy of them, which is the whole point of generating.
sankhya-metrics = { path = "../crates/sankhya-metrics" }
sankhya-error   = { path = "../crates/sankhya-error" }
sankhya-version = { path = "../crates/sankhya-version" }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
