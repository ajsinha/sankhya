[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sankhya"
version = "0.1.0"
description = "The SANKHYA client. Pure Python by decision: see ADR-0017."
readme = "QUICKSTART.md"
requires-python = ">=3.10"
# No dependencies, deliberately. The wire-protocol door needs nothing, which makes this the
# floor a client can always stand on: a stock interpreter with no build toolchain connects.
# `pyarrow` becomes an optional extra when the columnar path lands in M14.
dependencies = []

[tool.setuptools.packages.find]
include = ["sankhya*"]
